[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-pipeline"
version = "0.2.0"
description = "Autonomous, cross-platform job discovery, ATS scraping, persona-based matching, and LaTeX cover letter compilation pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Career Pipeline Contributors" }
]
keywords = ["job-search", "ats-crawler", "career-automation", "latex-cover-letter", "obsidian", "open-knowledge-format"]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=6.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0"
]

[project.scripts]
career-pipeline = "career_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/career_pipeline"]

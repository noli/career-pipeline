# Modular narrative templates for cover letter generation
narratives:
  default:
    hook: "As a seasoned technical leader and systems engineer with over a decade of experience bridging fundamental physical principles with series hardware delivery, I offer a proven record of driving complex technical initiatives into high-reliability production."
    experience: "Throughout my career, I have specialized in architecting and qualifying high-precision instrumentation operating under uncompromising operational constraints. My work encompasses the full lifecycle: defining system architecture and interface control documents, optimizing performance, ensuring compliance, and driving defect resolution across international supplier networks."
    mitigation: "Where specific internal workflows or toolchains differ from my immediate stack, my track record demonstrates exceptional learning velocity and an ability to translate first-principles problem solving into rapid, measurable engineering success."
    closing: "Based in the Munich area, I have followed your company trajectory and technological milestones with great admiration. I would welcome the opportunity to bring my engineering discipline, systems thinking, and leadership to your team."
